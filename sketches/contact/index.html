<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#030507" />
    <meta name="description" content="CONTACT — a physical browser instrument for touch, scroll, and sound." />
    <title>CONTACT — a physical instrument</title>
    <link rel="stylesheet" href="../../style.css" />
    <script src="../../script.js" defer></script>
  </head>
  <body>
    <main id="surface" class="surface" tabindex="0" aria-label="CONTACT instrument. Tap a speaker for a short sound. Hold and drag on the trackpad to play. Scroll vertically for pitch and horizontally for tone.">
      <div class="instrument-shell">
        <div class="deck-topline" aria-hidden="true">
          <span>CONTACT <span class="slash">/</span> 001</span>
          <span>PHYSICAL AUDIO INTERFACE</span>
        </div>

        <div class="keyboard-bank">
          <button id="left-speaker" class="speaker speaker--left" type="button" aria-label="Strike left speaker">
            <span class="speaker-grille" aria-hidden="true"></span>
            <span class="speaker-edge" aria-hidden="true"></span>
            <span class="speaker-number" aria-hidden="true">01</span>
          </button>

          <section id="keyboard-display" class="keyboard-display" aria-label="Neon dot matrix sound display">
            <div class="matrix-bed" aria-hidden="true"></div>
            <canvas id="matrix-canvas" aria-hidden="true"></canvas>
            <div class="display-topline" aria-hidden="true">
              <span>VOICE 01 <span class="dim">/</span> VOICE 02</span>
              <span id="mic-status" class="mic-status">MIC · OFF</span>
            </div>
            <div class="display-bottomline" aria-hidden="true">
              <span>HOLD · DRAG · SCROLL</span>
              <div class="readouts">
                <span id="pitch-readout">164 HZ</span>
                <span class="slash">/</span>
                <span id="tone-readout">1.2 KHZ</span>
              </div>
            </div>
          </section>

          <button id="right-speaker" class="speaker speaker--right" type="button" aria-label="Strike right speaker">
            <span class="speaker-grille" aria-hidden="true"></span>
            <span class="speaker-edge" aria-hidden="true"></span>
            <span class="speaker-number" aria-hidden="true">02</span>
          </button>
        </div>

        <div class="palm-rest">
          <div class="palm-caption palm-caption--left" aria-hidden="true">
            <span>01 / 02</span>
            <span>STRIKE</span>
          </div>

          <button id="trackpad" class="trackpad" type="button" aria-label="Trackpad. Hold to play and drag to shape the sound. Scroll to change pitch and tone.">
            <span class="trackpad-field" aria-hidden="true"></span>
            <span id="trackpad-pointer" class="trackpad-pointer" aria-hidden="true"></span>
            <span class="trackpad-center" aria-hidden="true">HOLD TO PLAY</span>
            <span class="trackpad-corner trackpad-corner--top" aria-hidden="true">◌ TOUCH SURFACE</span>
            <span class="trackpad-corner trackpad-corner--bottom" aria-hidden="true">X / Y</span>
          </button>

          <div class="palm-caption palm-caption--right" aria-hidden="true">
            <span>HOLD / DRAG</span>
            <span>SCROLL / SHAPE</span>
          </div>
        </div>

        <div class="deck-bottomline" aria-hidden="true">
          <span>INPUT: BODY + TRACKPAD</span>
          <span>OUTPUT: SOUND + LIGHT</span>
        </div>
      </div>
    </main>

    <div id="start-screen" class="start-screen">
      <div class="start-content">
        <span class="start-index" aria-hidden="true">CONTACT <span class="slash">/</span> 001</span>
        <button id="start-button" class="start-button" type="button">START <span class="start-arrow" aria-hidden="true">↗</span></button>
        <p id="start-note" class="start-note">SOUND BEGINS WITH A GESTURE</p>
      </div>
    </div>

    <p id="announcement" class="sr-only" role="status" aria-live="polite"></p>
  </body>
</html>
